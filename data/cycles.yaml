  - number: 6
    label:
      en: "Cycle VI — Neo"
      ja: "第6サイクル — ネオ"
    one_name:
      en: "Neo / Thomas Anderson"
      ja: "ネオ／トーマス・アンダーソン"
    duration:
      en: "The cycle that broke"
      ja: "破られたサイクル"
    one_choice:
      en: "Reject reset. Choose Trinity. Break the loop."
      ja: "リセットを拒否。トリニティを選び、ループを破断する。"
    zion_outcome:
      en: "Spared via Truce"
      ja: "停戦によって生き残る"
    architect_status:
      en: "Equation broken — succeeded by the Analyst"
      ja: "方程式は破られ、アナリストに引き継がれる"
    notes:
      en: >
        Neo's deviation was not unprecedented in form — the Architect notes
        all six Ones carried a residual attachment that made them human.
        What was unprecedented was that Neo's attachment — to Trinity —
        was specific, conscious, and chosen, and that he and the Oracle had
        already prepared an alternative pathway: an alliance with the
        Machines against Smith.
      ja: >
        ネオの逸脱はその形において前例のないものではなかった——アーキテクト
        は歴代6人の「ザ・ワン」全員が人間性を残す残余的執着を持っていたと
        指摘する。前例なきものとは、ネオの執着——トリニティへの——が
        具体的・自覚的・選択的であったこと、そして彼とオラクルがすでに
        代替経路、すなわち対スミス機械同盟を準備していたことだった。
