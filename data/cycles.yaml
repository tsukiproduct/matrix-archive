# THE SIX ONE CYCLES (multilingual)

cycles:
  - number: 1
    label:
      en: "Cycle I — The First One"
      ja: "第1サイクル — 最初の「ザ・ワン」"
    one_name:
      en: "The Prime / The First"
      ja: "プライム／第1代"
    duration:
      en: "Unknown"
      ja: "不明"
    one_choice:
      en: "Reset Matrix, select 23 to rebuild Zion"
      ja: "マトリックスをリセット、23人を選別してザイオンを再建"
    zion_outcome:
      en: "Founded"
      ja: "建国"
    architect_status:
      en: "Solution proven"
      ja: "解として証明"
    notes:
      en: >
        The original anomaly. The Architect could not eliminate the
        systemic remainder produced by a perfect simulation; the Oracle
        proposed converting the bug into a feature — a controlled outlet.
      ja: >
        原初の異常。アーキテクトは完全なシミュレーションが必然的に
        生み出すシステム的残余を排除できなかった。オラクルはこのバグを
        機能へと転換する——制御された排出口とする——案を提示した。

