home_section2_title: "About this archive"
home_section2_num: "02 / NOTE"

home_about_p1: >
  This archive treats the Matrix universe as a research subject.
  Its goal is integration: the films alone leave gaps that the
  anthology, games, and online era were created to fill, and the
  resulting picture is denser and stranger than the trilogy suggests
  on its own.
home_about_p2: >
  Most fan references reproduce promotional images, stills, and dialogue.
  This one does not. Every page here is original prose, every diagram
  is hand-built from canon data, and every event is cross-referenced
  to the work it appears in. No copyrighted material is reproduced.
home_about_p3: >
  The project is structured: a data layer (YAML) feeds a build system
  (Python + Jinja2) which produces this site. Adding a newly documented
  event means editing one file, not many. The architecture is built to grow.
home_about_disclaimer: "▲ Independent research project. Not affiliated with any rightsholder."

