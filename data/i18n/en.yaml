wk_section2_title: "On canonicity"
wk_section2_num: "04.2 / NOTE"
wk_about_p1: >
  Prime canon includes works the Wachowskis directly authored or
  sanctioned as part of the central story. This includes the four films,
  the entirety of <em>The Animatrix</em>, <em>Enter the Matrix</em>,
  and <em>The Matrix Online</em> — which was officially designated as
  the canonical continuation of the story after <em>Revolutions</em>.
wk_about_p2: >
  Secondary canon covers works that operate within the universe but
  are not part of the main story thread, or whose canonicity has been
  less rigorously affirmed — including several Animatrix shorts,
  <em>Path of Neo</em>, and most of the comics.
wk_about_p3: >
  The result is denser than the trilogy suggests. <em>Reloaded</em>
  contains a key plot beat — the disk delivered from the Osiris —
  whose entire delivery arc plays out across <em>Final Flight of the
  Osiris</em> and <em>Enter the Matrix</em>. The death of Morpheus,
  central to the post-truce era, occurs not in any film but in the
  online era.

