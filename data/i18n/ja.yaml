wk_section2_title: "正典性について"
wk_section2_num: "04.2 / NOTE"
wk_about_p1: >
  プライム・カノンとは、ウォシャウスキー姉妹が直接執筆またはストーリー
  の中核として承認した作品群を指す。これには4本の映画、『アニマトリックス』
  全話、『エンター・ザ・マトリックス』、そして『レボリューションズ』後の
  公式継続作として位置付けられた『マトリックス・オンライン』が含まれる。
wk_about_p2: >
  セカンダリ・カノンとは、宇宙内で機能するが本筋の物語スレッドからは
  外れる作品、あるいは正典性の確認が厳密になされていない作品を指す。
  これには『アニマトリックス』の数編、『パス・オブ・ネオ』、そしてコミック
  の大部分が含まれる。
wk_about_p3: >
  結果として全体は三部作が示唆するよりも遥かに濃密だ。『リローデッド』
  にはオシリスから運ばれたディスクという重要なプロットポイントがあるが、
  その配送過程は『ファイナル・フライト・オブ・オシリス』と『エンター・
  ザ・マトリックス』を横断してのみ完結する。戦後時代の中心となる
  モーフィアスの死は、いかなる映画でもなくオンライン時代に発生する。

