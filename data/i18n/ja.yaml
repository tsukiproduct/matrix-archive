home_section2_title: "本アーカイブについて"
home_section2_num: "02 / NOTE"

home_about_p1: >
  本アーカイブはマトリックスの宇宙を研究対象として扱う。目的は統合だ。
  映画単体ではアンソロジー、ゲーム、オンライン時代によって埋められる
  べき空隙が残されており、それらを総合した全体像は、三部作だけが示唆
  するよりも遥かに濃密で奇妙だ。
home_about_p2: >
  既存のファンサイトの多くは宣伝画像やスチル、台詞を転載している。
  本アーカイブはそれをしない。全ページが書き下ろし、全図解はカノン
  データから手作りで構築され、全イベントは出典作品とクロスリファレンス
  されている。著作物の複製は一切行わない。
home_about_p3: >
  プロジェクトは構造化されている。データ層（YAML）がビルドシステム
  （Python + Jinja2）を介して本サイトを生成する。新たに発掘された
  イベントを追加するには1ファイルを編集するだけで済む。拡張可能な設計だ。
home_about_disclaimer: "▲ 独立リサーチプロジェクト。いかなる権利者とも無関係。"

