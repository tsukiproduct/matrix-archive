<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrix Complete Archive</title>
<meta name="description" content="An independent research archive of the Matrix canon — bilingual edition.">
<link rel="alternate" hreflang="ja" href="ja/index.html">
<link rel="alternate" hreflang="en" href="en/index.html">
<link rel="alternate" hreflang="x-default" href="ja/index.html">
<link rel="stylesheet" href="assets/css/matrix.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%234ade80'>▲</text></svg>">
<script>
(function() {
  // 1. Saved preference wins
  try {
    var saved = localStorage.getItem('matrix-archive-lang');
    if (saved === 'ja' || saved === 'en') {
      location.replace(saved + '/index.html');
      return;
    }
  } catch (e) {}

  // 2. Browser language: English → en, default → ja
  var nav = (navigator.language || navigator.userLanguage || 'ja').toLowerCase();
  var target = nav.indexOf('en') === 0 ? 'en' : 'ja';
  location.replace(target + '/index.html');
})();
</script>
</head>
<body>
<canvas id="code-rain"></canvas>
<main style="min-height: 60vh; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1;">
  <div style="text-align: center; padding: 2rem;">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; letter-spacing: 0.25em; color: #4ade80; margin-bottom: 2rem;">
      MATRIX ARCHIVE / LANGUAGE SELECT
    </div>
    <h1 style="font-family: 'Cormorant Garamond', serif; color: #f5f5f0; font-size: clamp(2rem, 5vw, 3.5rem); margin-bottom: 2rem; font-weight: 400;">
      Choose your language<br>
      <span style="color: #4ade80;">/</span> 言語を選択
    </h1>
    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
      <a href="ja/index.html"
         style="display: inline-block; padding: 1rem 2.5rem; border: 1px solid #2a4530; color: #86efac; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.2em; text-decoration: none; text-transform: uppercase; font-size: 0.85rem;"
         onclick="try{localStorage.setItem('matrix-archive-lang','ja')}catch(e){}">日本語 / JA</a>
      <a href="en/index.html"
         style="display: inline-block; padding: 1rem 2.5rem; border: 1px solid #2a4530; color: #86efac; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.2em; text-decoration: none; text-transform: uppercase; font-size: 0.85rem;"
         onclick="try{localStorage.setItem('matrix-archive-lang','en')}catch(e){}">English / EN</a>
    </div>
    <p style="font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: #6b7c6e; margin-top: 3rem; letter-spacing: 0.15em;">
      Auto-redirect in progress · 自動転送中
    </p>
  </div>
</main>
<script src="assets/js/code-rain.js"></script>
</body>
</html>
